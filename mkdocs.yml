site_name: Create a plot using ggplot2
repo_url: https://github.com/richelbilderbeek/create_plot_using_ggplot2_course
edit_uri: blob/main/docs/

nav:
  - Start: README.md
  - Learning outcomes: learning_outcomes.md
  - Prerequisites: prerequisites.md
  - Course dates: course_dates.md
  - Schedule: schedule.md
  - Sessions:
    - Introduction 1: introduction_1/README.md
    - Install RStudio: install_rstudio/README.md
    - Basic workflow overview: create_plot/README.md
    - Plotting: plotting/README.md
    - Basic R: basic_r/README.md
    - Data import: data_import/README.md
    - Summary 1: summary_1.md
    - Data transformation: data_transformation/README.md
    - Data tidying: data_tidying/README.md
  - Misc:
    - Books: books/README.md
    - Evaluation: evaluation.md
    - Evaluations: evaluations/README.md
    - Frequently asked questions: faq.md
    - Lesson plans: lesson_plans/README.md
    - Meeting notes: meeting_notes/README.md
    - Reflections: reflections/README.md
  - Contact us: contact_us.md

theme:
  name: material
  font:
    text: Lato
    code: JetBrains Mono
  logo: logo/r_written.svg

  features:
    - toc.integrate
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - navigation.footer
    - navigation.expand
    - search.suggest
    - content.code.annotate
    - content.code.copy
    - content.code.copy
    - content.tabs.link
    - content.action.edit
    - content.action.view

markdown_extensions:
  # For adminitions, such as 'note', 'warning', etc
  - admonition
  # For tables
  - tables
  # For drop-down adminitions
  - pymdownx.details
  # For mermaid
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  # For tabs, where tabs are shown horizontally besides each other
  - pymdownx.tabbed:
      alternate_style: true
